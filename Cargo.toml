[workspace]
members = ["crates/frogcalc-core", "crates/frogcalc-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FrogCalc contributors"]

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
